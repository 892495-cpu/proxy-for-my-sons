services:
  proxy:
    build: .
    container_name: shayans-sons-proxy
    restart: unless-stopped
    ports:
      - "${PROXY_PORT:-8080}:8080"
    environment:
      PORT: "8080"
      PROXY_USERNAME: "${PROXY_USERNAME:-shayan daddy}"
      PROXY_PASSWORD: "${PROXY_PASSWORD:-iamshayansson}"
    init: true
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:8080/healthz').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 30s
      timeout: 3s
      retries: 3
